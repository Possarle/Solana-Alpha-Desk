[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
[project]
name = "solana-alpha-desk"
version = "0.2.0"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "websockets>=15,<17", "pydantic-settings>=2.7,<3", "sqlalchemy>=2.0,<3", "alembic>=1.14,<2", "httpx[socks]>=0.28,<1", "psycopg[binary]>=3.2,<4"]
[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11"]
[tool.setuptools.packages.find]
include = ["app*"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
